name: Deploy FutureCampus to VPS
on:
  push:
    branches:
      - production  # Only triggers when you push to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "${{secrets.SSH_HOST}}"
          REMOTE_USER: "${{secrets.SSH_REMOTE_USER}}"
          TARGET: "/var/www/html/futurecampus/"
          EXCLUDE: "/.git/, /node_modules/, /application/logs/"