; Only needed if the server runs PHP-FPM (with mod_php the vhost sets these per site).
; Copy to /etc/php/8.3/fpm/conf.d/99-rankers.ini. With FPM this applies to every site
; on the 8.3 pool, so check the values suit the other two sites too.
date.timezone = Asia/Kolkata
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
display_errors = Off
log_errors = On
