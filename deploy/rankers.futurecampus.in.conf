# Apache2 site for rankers.futurecampus.in, served by PHP 8.1-FPM.
# Only this site uses PHP 8.1; other sites keep whatever PHP they use now.
# Install: sudo cp to /etc/apache2/sites-available/ && sudo a2ensite rankers.futurecampus.in
# HTTPS:   sudo certbot --apache -d rankers.futurecampus.in  (creates the :443 copy of this block)
<VirtualHost *:80>
    ServerName rankers.futurecampus.in
    DocumentRoot /var/www/rankers

    <Directory /var/www/rankers>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    # Send PHP to the 8.1 FPM pool (overrides mod_php / the cPanel AddHandler in .htaccess)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Never serve local-dev files
    <LocationMatch "^/(docker|deploy|\.git)(/|$)|^/(docker-compose\.yml|DOCKER\.md|DEPLOY\.md)$">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/rankers_error.log
    CustomLog ${APACHE_LOG_DIR}/rankers_access.log combined
</VirtualHost>
